[package]
name = "nova-vgpu"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"
description = "Clean-room Rust reimplementation of NVIDIA Pascal (GP104 / Tesla P4) KVM vGPU stack analyzed from R535.309.01"

[dependencies]

[lib]
path = "src/lib.rs"

[[bin]]
name = "nova_vgpu_tool"
path = "src/bin/nova_vgpu_tool.rs"

[[bin]]
name = "nova_vgpu_guest_tool"
path = "src/bin/nova_vgpu_guest_tool.rs"

[[bin]]
name = "open-nvidia-vgpud"
path = "src/bin/open_nvidia_vgpud.rs"
