name: CI - Open Pascal vGPU Tests & Kbuild

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Rust Tests, Python Tests & Clean-Room Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev linux-headers-$(uname -r)
          python3 -m pip install --quiet cryptography

      - name: Run Python Unit & Hygiene Tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Run Rust nova-vgpu Tests
        run: |
          cd nova-vgpu
          cargo test --all-targets --verbose
          cargo build --bins --verbose

      - name: Build & Test Open C Daemons (libopen-vgxcfg, open-xid-logd, open-vgpu-mgr, open-nvml-smi, open-vgpu-plugin, open-vgpu-guest, open-nvenc, open-host-rm)
        run: |
          make -C open-vgxcfg clean all test clean
          make -C open-xid-logd clean all test clean
          make -C open-vgpu-mgr clean all test clean
          make -C open-nvml-smi clean all test clean
          make -C open-vgpu-plugin clean all test clean
          make -C open-vgpu-guest clean all test clean
          make -C open-nvenc clean all test clean
          make -C open-host-rm clean all test clean

      - name: Build & Test Clean-Room open-gridd
        run: |
          make -C open-gridd clean all test clean

      - name: Build Guest C Smoke Binary & Check Kmod Syntax
        run: |
          gcc -Wall -Wextra -O2 -I kmods/nova_vgpu_guest kmods/nova_vgpu_guest/test_guest_ioctl.c -o /tmp/test_guest_ioctl
          make -C kmods/nova_vgpu_mdev KDIR=/lib/modules/$(uname -r)/build || echo "Note: targeted at Linux 7.0+ host headers"
          make -C kmods/nova_vgpu_guest KDIR=/lib/modules/$(uname -r)/build || echo "Note: targeted at Linux 7.0+ guest headers"
